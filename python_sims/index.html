<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python + Browser Simulations</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    body {
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
      text-decoration: none;
      color: var(--ink);
      font-family: var(--mono);
      border: 1px solid var(--ink);
      padding: 0.65rem 1rem;
      transition: all 0.2s ease;
    }

    .back-link:hover,
    .back-link:focus-visible {
      background-color: var(--ink);
      color: var(--paper);
      text-decoration: none;
    }

    .header {
      margin-bottom: 2.5rem;
      text-align: center;
    }

    .header h1 {
      font-family: var(--serif);
      font-size: clamp(2.2rem, 5vw, 3.5rem);
      letter-spacing: 0.04em;
      margin: 0 0 0.5rem;
    }

    .header p {
      font-family: var(--mono);
      color: var(--muted);
      margin: 0 auto;
      max-width: 760px;
      line-height: 1.7;
    }

    .simulations-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.4rem;
      margin-top: 2rem;
    }

    .simulation-card {
      border: 1px solid var(--ink);
      padding: 1.25rem;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.14), transparent 42%),
        rgba(253, 251, 229, 0.84);
      box-shadow: 0 18px 36px -32px rgba(18, 18, 18, 0.72);
    }

    .simulation-card:hover,
    .simulation-card:focus-visible {
      transform: translateY(-3px);
      box-shadow: 0 26px 44px -34px rgba(18, 18, 18, 0.74);
      text-decoration: none;
    }

    .simulation-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .simulation-icon {
      width: 2.2rem;
      height: 2.2rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--ink);
      font-family: var(--serif);
      font-size: 1rem;
      font-weight: 700;
    }

    .simulation-status {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0.3rem 0.55rem;
      border: 1px solid var(--line);
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    .simulation-card h3 {
      font-family: var(--serif);
      font-size: 1.25rem;
      margin: 0;
      border-bottom: 1px solid var(--ink);
      padding-bottom: 0.55rem;
    }

    .simulation-card p {
      font-family: var(--mono);
      font-size: 0.9rem;
      color: var(--muted);
      margin: 0;
      line-height: 1.65;
      flex-grow: 1;
    }

    .launch-btn {
      margin-top: 0.35rem;
      padding: 0.78rem 1rem;
      border: 1px solid var(--ink);
      background-color: transparent;
      cursor: pointer;
      font-family: var(--mono);
      font-weight: 700;
      transition: all 0.2s ease;
      color: var(--ink);
    }

    .simulation-card:hover .launch-btn,
    .simulation-card:focus-visible .launch-btn {
      background-color: var(--ink);
      color: var(--paper);
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
    }

    .empty-state p {
      font-family: var(--mono);
      font-size: 0.95rem;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <a href="../index.html" class="back-link">&larr; Back to Portfolio</a>

  <div class="header">
    <h1>Python + Browser Simulations</h1>
    <p>
      A growing collection of interactive sims and browser experiments. Laser Sim, Flight Sim, and
      Ant Sim are now live and can be launched directly from this page.
    </p>
  </div>

  <div class="simulations-grid" id="simulations-container"></div>

  <script>
    const simulations = [
      {
        id: "laser_sim",
        title: "Laser Simulation",
        description: "Optical physics and laser behavior running as a browser-first interactive sim.",
        status: "LIVE",
        launchLabel: "Launch ->",
        icon: "L"
      },
      {
        id: "flight_sim",
        title: "Flight Sim",
        description: "A live browser build focused on flight behavior, control feel, and motion.",
        status: "LIVE",
        launchLabel: "Launch ->",
        icon: "F"
      },
      {
        id: "ant_sim",
        title: "Ant Sim",
        description: "A live browser build exploring ant movement, interaction, and emergent behavior.",
        status: "LIVE",
        launchLabel: "Launch ->",
        icon: "A"
      }
    ];

    function renderSimulations() {
      const container = document.getElementById("simulations-container");

      if (simulations.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <p>No simulations available yet.</p>
            <p>Add simulation folders to get started.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = simulations.map((sim) => `
        <a href="${sim.id}/index.html" target="_blank" rel="noreferrer" class="simulation-card">
          <div class="simulation-meta">
            <div class="simulation-icon" aria-hidden="true">${sim.icon}</div>
            <div class="simulation-status">${sim.status}</div>
          </div>
          <h3>${sim.title}</h3>
          <p>${sim.description}</p>
          <button class="launch-btn" type="button">${sim.launchLabel}</button>
        </a>
      `).join("");
    }

    renderSimulations();
  </script>
</body>
</html>
