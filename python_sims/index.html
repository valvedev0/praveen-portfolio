<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Simulations</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    body {
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 2rem;
      text-decoration: none;
      color: var(--ink);
      font-family: var(--mono);
      border: 1px solid var(--ink);
      padding: 0.5rem 1rem;
      transition: all 0.3s ease;
    }
    .back-link:hover {
      background-color: var(--ink);
      color: var(--paper);
    }
    .header {
      margin-bottom: 3rem;
      text-align: center;
    }
    .header h1 {
      font-family: var(--serif);
      font-size: 2.5rem;
      letter-spacing: 0.05em;
      margin: 0 0 0.5rem 0;
    }
    .header p {
      font-family: var(--mono);
      color: var(--muted);
      margin: 0;
    }
    .simulations-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
      margin-top: 2rem;
    }
    .simulation-card {
      border: 2px solid var(--ink);
      padding: 1.5rem;
      text-decoration: none;
      color: inherit;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
    }
    .simulation-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      background-color: var(--paper-light);
    }
    .simulation-card h3 {
      font-family: var(--serif);
      font-size: 1.3rem;
      margin: 0 0 0.5rem 0;
      border-bottom: 1px solid var(--ink);
      padding-bottom: 0.5rem;
    }
    .simulation-card p {
      font-family: var(--mono);
      font-size: 0.9rem;
      color: var(--muted);
      margin: 0.5rem 0 0 0;
      line-height: 1.6;
      flex-grow: 1;
    }
    .simulation-card .launch-btn {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border: 1px solid var(--ink);
      background-color: transparent;
      cursor: pointer;
      font-family: var(--mono);
      font-weight: 700;
      transition: all 0.3s ease;
    }
    .simulation-card .launch-btn:hover {
      background-color: var(--ink);
      color: var(--paper);
    }
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
    }
    .empty-state p {
      font-family: var(--mono);
      font-size: 0.95rem;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <a href="../index.html" class="back-link">← Back to Portfolio</a>
  
  <div class="header">
    <h1>Python Simulations</h1>
    <p>Interactive simulations built with Python, Pygame, and Pygbag</p>
  </div>

  <div class="simulations-grid" id="simulations-container">
    <!-- Simulations will be populated here -->
  </div>

  <script>
    // Define available simulations
    const simulations = [
      {
        id: 'laser_sim',
        title: 'Laser Simulation',
        description: 'Optical physics simulation demonstrating laser behavior, refraction, and diffraction.',
        icon: '🔦'
      },
      {
        id: 'agent_sim',
        title: 'Agent Simulation',
        description: 'Autonomous agents interacting in a virtual environment with emergent behavior.',
        icon: '🐜'
      },
      {
        id: 'particle_sim',
        title: 'Particle System',
        description: 'Dynamic particle effects and collision simulation.',
        icon: '✨'
      }
    ];

    function renderSimulations() {
      const container = document.getElementById('simulations-container');
      
      if (simulations.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <p>No simulations available yet.</p>
            <p>Add simulation folders to get started.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = simulations.map(sim => `
        <a href="${sim.id}/index.html" class="simulation-card">
          <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">${sim.icon}</div>
          <h3>${sim.title}</h3>
          <p>${sim.description}</p>
          <button class="launch-btn">Launch →</button>
        </a>
      `).join('');
    }

    // Render on load
    renderSimulations();
  </script>
</body>
</html>
